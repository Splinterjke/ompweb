services:
  omp:
    container_name: omp-docker
    build: .
    volumes:
      - pip-cache:/root/.cache/pip
      - omp-bin:/root/.local/bin
      - cargo-cache:/usr/local/cargo
      - rustup-cache:/usr/local/rustup
      - bun-cache:/root/.bun
      - chrome-agent-bin:/root/.chrome-agent
      - npm-cache:/root/.npm
      - ./:/work/ompweb
      - type: bind
        source: c:/users/dev/.omp # optionaly bind your existing .omp store into container from local `~/.omp` (Linux) or `c:/users/{user}/.omp`
        target: /root/.omp
        bind:
          create_host_path: false
    environment:
      - TZ
      - TERM
      - LANG
      - LC_ALL
      - LLAMA_CPP_BASE_URL=http://127.0.0.1:8080
      # Web sign-in gate, hash-only: the server accepts nothing but the scrypt
      # hash printed by `ompweb hash-password` (never a plaintext password —
      # every omp session inherits this environment). The default below is the
      # dev password "asdf1234" ($-escaped for compose interpolation); for
      # anything beyond a trusted LAN generate your own and override it in a
      # host .env file next to this file (.env values are literal — no $$
      # escaping needed there):
      #   ompweb hash-password            # paste the password, copy the hash
      #   echo 'OMP_WEB_PASSWORD_HASH=scrypt$...' > .env
      - OMP_WEB_PASSWORD_HASH=${OMP_WEB_PASSWORD_HASH:-scrypt$$15$$8$$1$$Ue6EfXEx76bt3rgqL4z__g$$fTgDbtPxJQMb7ie8BWwSAhIHrRmVwUv__8_soQfeSig}
      # Optional trusted-reverse-proxy vouch: a request whose X-Omp-Web-Auth
      # header hashes (SHA-256) to this digest is signed in without a
      # password. Pass-through — set OMP_WEB_TRUSTED_HEADER_SHA256 in the
      # host environment or .env to enable; unset leaves the gate password-only.
      - OMP_WEB_TRUSTED_HEADER_SHA256
      # Hosts the LAN browser is allowed to reach ompweb on the LAN.
      # REQUIRED for phone pairing via the QR: after switching to a LAN IP,
      # the Host check (isApiRequestHostAllowed) rejects non-loopback hosts
      # unless they are listed here. Set to this machine's LAN IP (or a
      # domain), e.g. "192.168.1.2" or "omp.example.com". Multiple values:
      # comma-separated, e.g. "192.168.1.2,omp.example.com".
      - OMP_WEB_ALLOWED_HOSTS=
    stdin_open: true
    tty: true
    ports:
      - "6767:6767"
      - "30177:30177"
      - "30178:30178"
      - "30179:30179"

volumes:
  pip-cache:
  omp-bin:
  cargo-cache:
  rustup-cache:
  bun-cache:
  chrome-agent-bin:
  npm-cache:
